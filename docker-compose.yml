services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wakeops
      POSTGRES_PASSWORD: wakeops
      POSTGRES_DB: wakeops
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - wakeops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wakeops -d wakeops']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - wakeops-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  wakeops-postgres:
  wakeops-rabbitmq:
